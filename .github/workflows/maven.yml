name: Debug surefire 2.21 on Windows

on:
  push:
    branches: [ debug-surefire-2.21 ]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: 11
    - uses: stCarolas/setup-maven@v4.5
      with:
        maven-version: 3.9.9
    - name: Build with Maven
      continue-on-error: true
      shell: bash
      run: mvn -X verify -Druntime=ol -DruntimeVersion=26.0.0.9 > mvn-debug.log 2>&1
    - name: Show fork evidence
      shell: bash
      run: |
        echo "=== dump files ==="; find . -name "*.dump*" -o -name "*.jvmRun*" | head
        for f in $(find . -name "*.dump*" | head -5); do echo "--- $f"; cat "$f" | head -60; done
        echo "=== debug log: fork/java lines ==="
        grep -nE "Forking command line|Error:|Exception in|Could not|Unrecognized|Invalid|Caused by|surefirebooter|exit|Exit" mvn-debug.log | grep -v "^\S*\s*at " | tail -60
        echo "=== tail ==="; tail -80 mvn-debug.log
