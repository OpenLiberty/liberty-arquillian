name: Debug surefire 2.21 on Windows

on:
  push:
    branches: [ debug-surefire-2.21 ]
  pull_request:
    branches: [ 1.x-maintenance ]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: 11
    - uses: stCarolas/setup-maven@v4.5
      with:
        maven-version: 3.9.9
    - name: Build with Maven
      continue-on-error: true
      shell: bash
      run: mvn -X verify -Druntime=ol -DruntimeVersion=26.0.0.9 > mvn-debug.log 2>&1
    - name: Show fork evidence
      shell: bash
      run: |
        n=$(grep -n "Forking command line" mvn-debug.log | tail -1 | cut -d: -f1)
        echo "=== lines after fork (line $n) ==="; sed -n "${n},$((n+40))p" mvn-debug.log | cut -c1-400
        echo "=== dump files ==="
        for f in $(find . -name "*.dump*"); do echo "--- $f"; head -80 "$f"; done
        echo "=== java settings ==="; java -XshowSettings:properties -version 2>&1 | grep -E "file.encoding|java.version|user.dir"
    - name: Re-run the fork command by hand
      shell: bash
      run: |
        cmdline=$(grep "Forking command line" mvn-debug.log | tail -1 | sed -E 's/^.*Forking command line: //')
        echo "CMD: $cmdline" | cut -c1-600
        inner=$(echo "$cmdline" | sed -E 's/^cmd.exe \/X \/C "(.*)"$/\1/')
        echo "INNER: $inner" | cut -c1-600
        cd liberty-managed
        echo "=== run with stdin closed ==="
        cmd.exe //X //C "$inner" < /dev/null 2>&1 | head -60
        echo "exit: ${PIPESTATUS[0]}"
        echo "=== booter jar manifest ==="
        jar=$(echo "$inner" | grep -oE '[A-Za-z]:[^ ]*surefirebooter[0-9]+\.jar' | head -1)
        echo "$jar"; unzip -p "$(cygpath -u "$jar")" META-INF/MANIFEST.MF | cut -c1-300
