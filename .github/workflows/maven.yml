name: Debug surefire 2.21 on Windows

on:
  push:
    branches: [ debug-surefire-2.21 ]
  pull_request:
    branches: [ 1.x-maintenance ]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: 11
    - uses: stCarolas/setup-maven@v4.5
      with:
        maven-version: 3.9.9
    - name: Build with Maven
      continue-on-error: true
      shell: bash
      run: mvn -X verify -Druntime=ol -DruntimeVersion=26.0.0.9 > mvn-debug.log 2>&1
    - name: Show fork evidence
      shell: bash
      run: |
        n=$(grep -n "Forking command line" mvn-debug.log | tail -1 | cut -d: -f1)
        echo "=== lines after fork (line $n) ==="; sed -n "${n},$((n+40))p" mvn-debug.log | cut -c1-400
        echo "=== dump files ==="
        for f in $(find . -name "*.dump*"); do echo "--- $f"; head -80 "$f"; done
        echo "=== java settings ==="; java -XshowSettings:properties -version 2>&1 | grep -E "file.encoding|java.version|user.dir"
    - name: Run the fork command by hand
      shell: cmd
      run: |
        cd liberty-managed
        dir target\surefire-reports\wlp-dropins-deployment-test
        for /f "delims=" %%d in ('dir /b /ad /o-d "%TEMP%\surefire*" 2^>nul') do (echo found %%d & dir "%TEMP%\%%d" & goto :done)
        :done
        exit /b 0
